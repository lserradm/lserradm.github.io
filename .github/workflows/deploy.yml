name: Publish collections
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing website.zip
        required: true
        default: website-2026-11-09-textiles
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified website archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --location --retry 3 --output website.zip "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/website.zip"
          echo "cda473dc37efe8ee9dbc3e2b0f002fa0548a445cf8ed322b33883e9b91ff2c4b  website.zip" | sha256sum --check -
          mkdir public
          unzip -q website.zip -d public
          test -f public/index.html
          test -f public/tribal/index.html
          test -f public/modern/index.html
          test -f public/carpets/index.html
          test -f public/photography/index.html
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
